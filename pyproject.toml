[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "riffly"
version = "0.1.0"
description = "Tiny VAE that writes looping rap-style MIDI melodies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yannick Gibson", email = "gibson.yannick@gmail.com" }]
keywords = ["midi", "music", "vae", "generative", "deep-learning", "melody"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mido",
    "numpy",
    "pretty_midi",
    "scikit-learn",
    "scipy",
    "torch",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
interactive = ["librosa", "matplotlib", "pandas", "sounddevice"]
dev = ["ruff", "mypy", "pytest"]

[project.urls]
Homepage = "https://github.com/YannickGibson/riffly"
Issues = "https://github.com/YannickGibson/riffly/issues"

# torch resolves from PyPI by default, which is the CUDA (GPU) build on
# Linux/Windows. To force the CPU-only build, install with uv's backend flag:
#   uv sync --extra dev --extra interactive && uv pip install torch --torch-backend=cpu
# or set the environment variable UV_TORCH_BACKEND=cpu.

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E"]

[tool.mypy]
files = ["riffly"]
